    <div class="row2"><div class="field"><label>Biztosító</label><div id="f-ins"></div></div><div class="field"><label>Kötvényszám</label><input id="f-pol" value="${esc(d.policy)}"></div></div>
    <div class="row2"><div class="field"><label>Évforduló (kockázatviselés kezdete)</label><input id="f-start" type="date" value="${d.start}"></div><div class="field"><label>Fizetés módja</label><select id="f-pay">${PAY.map(p=>`<option ${p===d.pay?'selected':''}>${p}</option>`).join('')}</select></div></div>
    <div class="field"><label>Pénznem</label><div class="segline" id="f-cur"><button type="button" data-cur="HUF" class="${d.cur!=='EUR'?'on':''}">HUF (Ft)</button><button type="button" data-cur="EUR" class="${d.cur==='EUR'?'on':''}">EUR (€)</button></div><div class="hint">Bármelyik szerződés lehet euróban is: nyugdíj, megtakarítás vagy más.</div></div>
    <div class="field"><label>Díjfizetési ütem</label><div class="segline" id="f-freq">${Object.entries(FREQ).map(([k,v])=>`<button type="button" data-f="${k}" class="${k===d.freq?'on':''}">${v.n}</button>`).join('')}</div></div>
    <div class="row2"><div class="field"><label id="f-pfee-l">${FREQ[d.freq].n} díj (${CURSYM(d.cur)})</label><input id="f-pfee" inputmode="numeric" value="${d.fee?Math.round(d.fee/FREQ[d.freq].p):''}"></div><div class="field"><label id="f-fee-l">Éves díj (${CURSYM(d.cur)})</label><input id="f-fee" inputmode="numeric" value="${d.fee||''}"><div class="hint">Bármelyiket írod, a másik kiszámolódik.</div></div></div>
    <div id="f-det">${detailFields(T(d.type).kind,d.details)}</div>
    <div id="f-info">${infoFields(T(d.type).kind,d.info||{})}</div>
    ${S.role==='advisor'?`<div class="field adv-only"><label>Kinél van a szerződés? <span class="advtag">csak te látod</span></label><div class="segline" id="f-own">${[['me','Nálam'],['other','Más tanácsadónál'],['direct','Közvetlenül a biztosítónál']].map(([k,n])=>`<button type="button" data-own="${k}" class="${(d.own||'')===k?'on':''}">${n}</button>`).join('')}</div><div class="hint">A nem nálad lévő vagyonbiztosítások évfordulóit az Ügyfeleim oldalon ajánlatlehetőségként látod.</div></div>`:''}
    <div class="field"><label>Megjegyzés</label><textarea id="f-note" placeholder="Bármi, amit érdemes tudni erről a szerződésről">${esc(d.note)}</textarea></div>`;
  const foot=`${id?`<button class="btn ghost danger" id="f-del" style="margin-right:auto">${svg('trash')}Törlés</button>`:''}<button class="btn" data-close>Mégse</button><button class="btn primary" id="f-save">${svg('check')}${id?'Mentés':'Hozzáadás'}</button>`;
  modal(id?'Szerződés szerkesztése':'Új szerződés',body,foot,m=>{
    const $=s=>m.querySelector(s);
    insPicker($('#f-ins'), d.insurer, v=>d.insurer=v);
    const grabIdent=()=>['label','vehicle','plate','address'].forEach(k=>{const el=$('#f-'+k); if(el) d[k]=el.value;});
    const grabDet=()=>{
      const kind=T(d.type).kind, dt={...d.details}, v=id=>{const el=$(id); return el?el.value:'';};
      if(kind==='property'){ dt.area=num(v('#d-area')); dt.sum=num(v('#d-sum')); dt.mortgage=$('#d-mortgage').checked?1:0; dt.bank=v('#d-bank').trim(); }
      if(kind==='life'){ dt.risks=[...m.querySelectorAll('#d-risks .r')].map(r=>({n:r.querySelector('[data-rn]').value.trim(),a:num(r.querySelector('[data-ra]').value)})).filter(x=>x.n); }
      if(kind==='pension'||kind==='savings'||kind==='child'){
        if(kind==='pension'){ dt.clause=$('#d-clause').checked?1:0; dt.tax=$('#d-tax').checked?1:0; }
        if(kind==='savings'){ dt.goal=v('#d-goal').trim(); dt.targetDate=v('#d-target'); }
        if(kind==='child'){ const on=m.querySelector('#d-born .on'); dt.childBorn=on?+on.dataset.born:1; dt.childName=v('#d-cname').trim(); dt.childBirth=v('#d-cbirth'); dt.dueDate=v('#d-due'); dt.nameAtSign=v('#d-nas').trim(); dt.targetAge=num(v('#d-tage'))||18; }
        dt.signDate=v('#d-sign'); dt.funds=[...m.querySelectorAll('#d-funds .r')].map(r=>({code:r.querySelector('[data-fc]').value.trim(),pct:num(r.querySelector('[data-fp]').value)})).filter(x=>x.code);
        dt.yieldFt=num(v('#d-yft')); dt.yieldPct=num(v('#d-ypct')); dt.annualPct=num(v('#d-apct'));
      }
      d.details=dt;
    };
    const bindDet=()=>{
      const kind=T(d.type).kind;
      if(kind==='property'){ const upd=()=>{const a=num($('#d-area').value), s=num($('#d-sum').value), q=a&&s?s/a:0, el=$('#d-sqm'), low=d.cur!=='EUR'&&q&&q<LOW_SQM; el.textContent=q?`${fmtC(q,d.cur)} / m²${low?', alacsony, érdemes átnézni':''}`:''; el.classList.toggle('warn',!!low);};
        $('#d-area').oninput=upd; $('#d-sum').oninput=upd; upd(); $('#d-mortgage').onchange=e=>{$('#d-bank-w').hidden=!e.target.checked;}; }
      if(kind==='child'){ $('#d-born').onclick=e=>{const b=e.target.closest('[data-born]'); if(!b) return; m.querySelectorAll('#d-born button').forEach(x=>x.classList.toggle('on',x===b)); const born=b.dataset.born==='1'; $('#d-cbirth-w').hidden=!born; $('#d-due-w').hidden=born; if(!born) toast('💕','Gratulálunk! Ez nagyon szép döntés.');};
        const cn=$('#d-cname'), nas=$('#d-nas'); cn.addEventListener('change',()=>{ if(!nas.value) nas.placeholder=cn.value||'pl. Pocaklakó'; }); }
      if(kind==='pension'||kind==='savings'||kind==='child'){ const h=()=>{const out=$('#d-sign-h'); const sd=$('#d-sign').value;
          if(kind==='pension'){ const holder=holderOf(hh,$('#f-holder').value);
            if(sd&&holder&&holder.birthDate){const a=ageAt(holder.birthDate,sd); const r=D_(holder.birthDate); r.setFullYear(r.getFullYear()+65); out.textContent=`Kötéskor ${a} éves volt, a 65. születésnapjáig ${ymLeft(D_(sd),r).y} év volt hátra.`;}
            else out.textContent=holder&&holder.kind==='person'&&!holder.birthDate?'Az ügyfél születési idejét a profilkártyán add meg, és kiszámoljuk az életkort.':''; }
          else if(kind==='child'){ const cb=$('#d-cbirth').value; out.textContent = sd&&cb ? (D_(cb)>D_(sd)?'Kötéskor a gyermek még nem született meg.':`Kötéskor a gyermek ${kidAge(cb)==='még nem született'?'':''}${(()=>{const x=D_(cb),y=D_(sd); const mm=(y.getFullYear()-x.getFullYear())*12+y.getMonth()-x.getMonth(); return mm<12?mm+' hónapos':Math.floor(mm/12)+' éves';})()} volt.`) : ''; }
          else out.textContent=''; };
        $('#d-sign').oninput=h; $('#f-holder').addEventListener('change',h); const cb=$('#d-cbirth'); if(cb) cb.addEventListener('input',h); h(); }
    };
    m.addEventListener('click',e=>{
      if(e.target.closest('[data-addrisk]')) $('#d-risks').insertAdjacentHTML('beforeend',riskRow({}));
      if(e.target.closest('[data-addfund]')) $('#d-funds').insertAdjacentHTML('beforeend',fundRow({}));
      const del=e.target.closest('[data-delrow]'); if(del){ const list=del.closest('.rowlist'); del.closest('.r').remove(); if(!list.children.length) list.insertAdjacentHTML('beforeend', list.id==='d-risks'?riskRow({}):fundRow({})); }
    });
    const bindIdent=()=>{ const p=$('#f-plate'); if(p) p.oninput=()=>{$('#f-plate-prev').innerHTML=plateHTML(p.value,'lg');}; };
    const grabInfo=()=>{ const i={...(d.info||{})}, g=x=>{const el=$(x); return el?el.value.trim():undefined;}; const as=$('#i-assist'); if(as){ i.assist=as.checked?1:0; i.assistPhone=g('#i-aph'); } const bo=m.querySelector('#i-benef .on'); if(bo){ i.benefType=bo.dataset.b; i.benefNames=g('#i-bn'); } i.claimPhone=fmtPhone(g('#i-cph')||''); if(i.assistPhone) i.assistPhone=fmtPhone(i.assistPhone); i.todo=g('#i-todo')||''; d.info=i; };
    const bindInfo=()=>{ const as=$('#i-assist'); if(as) as.onchange=()=>{$('#i-aph-w').hidden=!as.checked;}; const be=$('#i-benef'); if(be) be.onclick=e=>{const b=e.target.closest('[data-b]'); if(!b) return; be.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b)); $('#i-bn-w').hidden=b.dataset.b!=='named';}; };
    const setType=k=>{ grabIdent(); grabDet(); grabInfo(); $('#f-info').innerHTML=infoFields(T(k).kind,d.info||{}); d.type=k; $('#f-types').innerHTML=typeGrid(k); $('#f-ident').innerHTML=identFields(T(k).kind,d); $('#f-det').innerHTML=detailFields(T(k).kind,d.details); $('#f-info').innerHTML=infoFields(T(k).kind,d.info||{}); bindIdent(); bindDet(); bindInfo(); };
    $('#f-types').onclick=e=>{const b=e.target.closest('button'); if(!b) return; if(b.hasAttribute('data-newtype')) return openNewType(m,setType); setType(b.dataset.t);};
    const pf=$('#f-pfee'), af=$('#f-fee');
    pf.oninput=()=>{const v=num(pf.value); af.value=v?grp(Math.round(v*FREQ[d.freq].p)):'';};
    af.oninput=()=>{const v=num(af.value); pf.value=v?grp(Math.round(v/FREQ[d.freq].p)):'';};
    $('#f-freq').onclick=e=>{const b=e.target.closest('[data-f]'); if(!b) return; d.freq=b.dataset.f; m.querySelectorAll('#f-freq button').forEach(x=>x.classList.toggle('on',x===b)); $('#f-pfee-l').textContent=`${FREQ[d.freq].n} díj (${CURSYM(d.cur)})`; const v=num(af.value); pf.value=v?grp(Math.round(v/FREQ[d.freq].p)):'';};
    $('#f-cur').onclick=e=>{const b=e.target.closest('[data-cur]'); if(!b) return; d.cur=b.dataset.cur; m.querySelectorAll('#f-cur button').forEach(x=>x.classList.toggle('on',x===b)); $('#f-pfee-l').textContent=`${FREQ[d.freq].n} díj (${CURSYM(d.cur)})`; $('#f-fee-l').textContent=`Éves díj (${CURSYM(d.cur)})`; const s=$('#d-sum'); if(s) s.dispatchEvent(new Event('input'));};
    bindIdent(); bindDet(); bindInfo();
    const fo=$('#f-own'); if(fo) fo.onclick=e=>{const b=e.target.closest('[data-own]'); if(!b) return; d.own=b.dataset.own; fo.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b));};
    $('#f-save').onclick=()=>{
      grabIdent(); grabDet(); grabInfo(); const t=T(d.type);
      if(t.kind==='vehicle'&&!d.vehicle.trim()&&!d.plate.trim()){ $('#f-vehicle').focus(); toast('🚗','Add meg az autót vagy a rendszámot.'); return; }
      if(t.kind!=='vehicle'&&!d.label.trim()){ $('#f-label').focus(); toast('✍️','Adj nevet, hogy könnyen megtaláld.'); return; }
      const data={holder:$('#f-holder').value,type:d.type,label:d.label.trim(),vehicle:d.vehicle.trim(),plate:fmtPlate(d.plate),address:d.address.trim(),insurer:d.insurer,policy:$('#f-pol').value.trim(),fee:num(af.value),cur:d.cur,freq:d.freq,pay:$('#f-pay').value,start:$('#f-start').value||iso(today()),note:$('#f-note').value.trim(),details:d.details,info:d.info||{},own:d.own||(S.role==='advisor'?'me':'')};
      let c; if(id){ c=orig; Object.assign(c,data); } else { c={id:uid('c'),hh:hh.id,feeOk:0,feeNote:'',reviewAtAnniv:0,notify:[],review:0,advisorSeenAt:0,...data}; S.contracts.push(c); }
      touch(c); save(); closeModal(); render(); toast(id?'💾':'📄', id?'Mentve.':'Hozzáadva. Ez is egy helyen van már!');
    };
    const del=$('#f-del'); if(del) del.onclick=()=>confirmBox(`A(z) „${esc(cTitle(orig))}” szerződés véglegesen törlődik.`,'Törlés',()=>{S.contracts=S.contracts.filter(x=>x.id!==id); selected.delete(id); save(); render(); toast('🗑️','Törölve.');});
  });
}

function openNewType(m,setType){
  const box=m.querySelector('#f-newtype'); if(box.innerHTML){box.innerHTML='';return;}
  let icon='umbrella', color=COLORS[4], kind='general', name='';
  const draw=()=>{
    box.innerHTML=`<div class="newtype">
      <div class="field"><label>Az új típus neve</label><input id="nt-name" value="${esc(name)}" placeholder="pl. Utasbiztosítás, Kisállat-biztosítás"></div>
      <div class="field"><label>Piktogram</label><div class="icons">${ICON_CHOICES.map(i=>`<button type="button" data-ic="${i}" class="${i===icon?'on':''}" style="padding:2px">${picto({i,c:color},30)}</button>`).join('')}</div></div>
      <div class="field"><label>Szín</label><div class="swatches">${COLORS.map(c=>`<button type="button" data-col="${c}" class="${c===color?'on':''}" style="background:${c}" aria-label="szín"></button>`).join('')}</div></div>
      <div class="field"><label>Milyen adatot kérjünk hozzá?</label><div class="segline" id="nt-kind">${KINDS.map(([k,n])=>`<button type="button" data-k="${k}" class="${k===kind?'on':''}">${n}</button>`).join('')}</div></div>
      <div style="display:flex;justify-content:flex-end;gap:8px"><button type="button" class="btn ghost" id="nt-cancel">Mégse</button><button type="button" class="btn primary" id="nt-save">${svg('plus')}Típus létrehozása</button></div></div>`;
    const ni=box.querySelector('#nt-name'); ni.oninput=()=>name=ni.value;
    box.querySelector('.icons').onclick=e=>{const b=e.target.closest('[data-ic]'); if(b){icon=b.dataset.ic; draw();}};
    box.querySelector('.swatches').onclick=e=>{const b=e.target.closest('[data-col]'); if(b){color=b.dataset.col; draw();}};
    box.querySelector('#nt-kind').onclick=e=>{const b=e.target.closest('[data-k]'); if(b){kind=b.dataset.k; draw();}};
    box.querySelector('#nt-cancel').onclick=()=>box.innerHTML='';
    box.querySelector('#nt-save').onclick=()=>{const n=name.trim(); if(!n){ni.focus();return;} const t={k:uid('t'),n,i:icon,c:color,kind}; S.types.push(t); save(); box.innerHTML=''; setType(t.k); toast('✨',`Új típus: ${n}`);};
  };
  draw(); box.querySelector('#nt-name').focus();
}

let pickCb=null;
function pickImage(maxW, square, cb){ pickCb={maxW,square,cb}; const f=document.getElementById('file-pick'); f.value=''; f.click(); }
document.getElementById('file-pick').onchange=e=>{
  const file=e.target.files[0]; if(!file||!pickCb) return; const {maxW,square,cb}=pickCb;
  const r=new FileReader(); r.onload=()=>{const img=new Image(); img.onload=()=>{
    const cv=document.createElement('canvas'), ctx=cv.getContext('2d');
    if(square){ const side=Math.min(img.width,img.height), s=Math.min(1,maxW/side); cv.width=cv.height=Math.round(side*s); ctx.drawImage(img,(img.width-side)/2,(img.height-side)/2,side,side,0,0,cv.width,cv.height); cb(cv.toDataURL('image/jpeg',.85)); }
    else { const s=Math.min(1,maxW/Math.max(img.width,img.height)); cv.width=Math.round(img.width*s); cv.height=Math.round(img.height*s); ctx.drawImage(img,0,0,cv.width,cv.height); cb(cv.toDataURL('image/png')); }
  }; img.src=r.result;}; r.readAsDataURL(file);
};

function cheer(btn, special){
  if(btn){ const r=btn.getBoundingClientRect(); burst(r.left+12,r.top+r.height/2); }
  setTimeout(()=>{ if(special) toast(special[0],special[1]); else { const ch=CHEERS[Math.floor(Math.random()*CHEERS.length)]; toast(ch[0],ch[1]); } },100);
}
function burst(x,y){
  if(matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const bits=['✨','💚','⭐','●','●','●'];
  for(let i=0;i<11;i++){ const s=document.createElement('span'); s.className='burst'; const ang=(Math.PI*2*i/11)+Math.random()*.4, dist=34+Math.random()*40, b=bits[i%bits.length];
    s.textContent=b; if(b==='●'){s.style.color=['#50C3C8','#E9406D','#38A374'][i%3]; s.style.fontSize='9px';}
    s.style.left=x+'px'; s.style.top=y+'px'; s.style.setProperty('--dx',Math.cos(ang)*dist+'px'); s.style.setProperty('--dy',Math.sin(ang)*dist+'px'); s.style.setProperty('--r',(Math.random()*120-60)+'deg');
    document.body.appendChild(s); setTimeout(()=>s.remove(),850); }
}
function toast(em,text){
  const box=document.getElementById('toasts'); while(box.children.length>1) box.firstChild.remove();
  const t=document.createElement('div'); t.className='toast'; t.innerHTML=`<span class="em">${em}</span>${esc(text)}`; box.appendChild(t);
  setTimeout(()=>{t.classList.add('out'); setTimeout(()=>t.remove(),300);},2400);
}

function pdfLines(c){
  const t=T(c.type), d=c.details||{}, f=FREQ[c.freq]||FREQ.eves, h=holderOf(curHH(),c.holder)||{}, L=[];
  if(t.kind==='life'&&(d.risks||[]).length) L.push(d.risks.map(r=>`${r.n}: ${fmtC(r.a,c.cur)}`).join(' | '));
  if(t.kind==='property'){ const b=[]; if(d.area) b.push(d.area+' m²'); if(d.sum) b.push('biztosítási összeg '+fmtC(d.sum,c.cur)); if(d.mortgage) b.push('jelzálog'+(d.bank?': '+d.bank:'')); if(b.length) L.push(b.join(', ')); }
  if(t.kind==='pension'){ let g='Cél: nyugdíj'; if(h.birthDate){ const r=D_(h.birthDate); r.setFullYear(r.getFullYear()+65); g+=`, 65 éves korra (${r.getFullYear()})`; } L.push(g); }
  if(t.kind==='child'){ L.push(`Cél: ${d.childName?d.childName+' jövője':'a gyermek jövője'}, ${d.targetAge||18} éves korára`); }
  if(t.kind==='savings'&&d.goal) L.push('Cél: '+d.goal);
  if(isLife(c)&&t.kind!=='life') L.push(`Folytatólagos díj: ${f.adv} ${fmtC(c.fee/f.p,c.cur)}`);
  return L;
}

async function makePDF(){
  const hh=curHH(), scope=S.holder==='all'?hhContracts(hh):hhContracts(hh).filter(c=>c.holder===S.holder);
  const sel=scope.filter(c=>selected.has(c.id)), list=sel.length?sel:scope;
  if(!list.length){ toast('🤔','Nincs mit letölteni.'); return; }
  if(!window.html2canvas||!window.jspdf){ toast('⏳','A PDF-készítő még töltődik, próbáld újra.'); return; }
  toast('🖨️','Készül a PDF…');
  const host=document.getElementById('report-host'); host.innerHTML=reportHTML(list);
  try{
    await document.fonts.ready;
    const canvas=await html2canvas(host.firstElementChild,{scale:2,backgroundColor:'#ffffff'});
    const pdf=new jspdf.jsPDF({unit:'mm',format:'a4'}); const W=210,H=297,pageH=Math.floor(canvas.width*H/W); let y=0;
    while(y<canvas.height){ const sl=document.createElement('canvas'); sl.width=canvas.width; sl.height=Math.min(pageH,canvas.height-y);
      sl.getContext('2d').drawImage(canvas,0,y,canvas.width,sl.height,0,0,canvas.width,sl.height);
      if(y>0) pdf.addPage(); pdf.addImage(sl.toDataURL('image/jpeg',.92),'JPEG',0,0,W,sl.height*W/canvas.width); y+=pageH; }
    const name=`Biztositasi-attekintes_${hh.name.normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^A-Za-z0-9]+/g,'-')}_${iso(today())}.pdf`;
    if(dl) await dl.save({filename:name,data:pdf.output('blob')}); else pdf.save(name);
    toast('✅','PDF letöltve.');
  }catch(e){ toast(e&&e.code==='declined'?'👌':'⚠️', e&&e.code==='declined'?'Rendben, most nem töltjük le.':'A PDF most nem készült el. Próbáld újra.'); }
  finally{ host.innerHTML=''; }
}

  if(ds.inslogo){ const ins=insOf(ds.inslogo); pickImage(240,false,u=>{ins.logo=u; save(); render(); toast('🖼️',`${ins.n} logója feltöltve.`);}); return; }
  if(ds.inslogoX){ const ins=insOf(ds.inslogoX); ins.logo=''; save(); render(); return; }
  if(ds.exp){ expanded.has(ds.exp)?expanded.delete(ds.exp):expanded.add(ds.exp); render(); return; }
  if(ds.holder){ S.holder=(ds.holder!=='all'&&S.holder===ds.holder)?'all':ds.holder; save(); render(); return; }
  const a=ds.act;
  if(a==='add-contract') contractForm();
  else if(a==='add-holder') holderForm();
  else if(a==='add-client') clientForm();
  else if(a==='edit-advisor') advisorForm();
  else if(a==='add-insurer') textPrompt('Új biztosító','A társaság neve','',v=>{ if(v&&!insOf(v)){ S.insurers.push({n:v,logo:'',star:false}); save(); render(); toast('🏢',`${v} hozzáadva.`);} });
  else if(a==='share') shareModal();
  else if(a==='pdf') makePDF();
  else if(a==='send') sendMsg(document.getElementById('msg').value);
  else if(a==='ask-meeting'){ S.page='chat'; save(); render(); const ta=document.getElementById('msg'); if(ta){ta.value='Szia Bence! Szeretnék egy időpontot egyeztetni.'; ta.focus();} }
  else if(a==='sel-all'){ const hh=curHH(); (S.holder==='all'?hhContracts(hh):hhContracts(hh).filter(c=>c.holder===S.holder)).forEach(c=>selected.add(c.id)); render(); }
  else if(a==='sel-clear'){ selected.clear(); render(); }
  else if(a==='toggle-all'){ const hh=curHH(), l=S.holder==='all'?hhContracts(hh):hhContracts(hh).filter(c=>c.holder===S.holder), all=l.every(c=>expanded.has(c.id)); l.forEach(c=>all?expanded.delete(c.id):expanded.add(c.id)); render(); }
  else if(a==='calc-talk'){ const M=CALC_MODES[CALC.mode], sc=calcCfg().scen[CALC.scen]; S.page='chat'; save(); render(); const ta=document.getElementById('msg'); if(ta){ ta.value=`Szia Bence! Kipróbáltam a kalkulátort (${M.n}): havi ${fmt(CALC.monthly)}, ${CALC.years} év, ${sc.n.toLowerCase()} szcenárió. Átbeszélnénk?`; ta.focus(); } }
  else if(a==='export') exportData();
  else if(a==='import') importData();
  else if(a==='reset') confirmBox('Minden módosításod elvész, és visszaállnak a mintaadatok.','Visszaállítás',()=>{S=seed(); migrate(); selected.clear(); expanded.clear(); save(); render(); toast('🔄','Mintaadatok visszaállítva.');});
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape') closeModal();
  if(e.key==='Enter'&&!e.shiftKey&&e.target.id==='msg'){ e.preventDefault(); sendMsg(e.target.value); }
  if((e.key==='Enter'||e.key===' ')&&e.target.classList&&(e.target.classList.contains('prof')||e.target.classList.contains('lrow'))){ e.preventDefault(); e.target.click(); }
});
function fmtInput(el){
  const v=el.value, fromEnd=v.length-(el.selectionStart??v.length), neg=/^\s*-/.test(v), d=v.replace(/\D/g,'');
  const nv=(neg?'-':'')+(d?grp(d.replace(/^0+(?=\d)/,'')):'');
  if(nv!==v){ el.value=nv; const pos=Math.max(0,nv.length-fromEnd); try{el.setSelectionRange(pos,pos);}catch(e){} }
}
document.addEventListener('input',e=>{ const t=e.target; if(t.matches&&t.matches('input[inputmode="numeric"]')) fmtInput(t); },true);
document.addEventListener('input',e=>{ if(e.target.id==='msg'){ e.target.style.height='auto'; e.target.style.height=Math.min(130,e.target.scrollHeight)+'px'; } });

async function exportData(){
  const name=`ugyfelportal-mentes_${iso(today())}.json`, blob=new Blob([JSON.stringify(S)],{type:'application/json'});
  try{
    if(dl) await dl.save({filename:name,data:blob});
    else { const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=name; document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href); a.remove();},1000); }
    toast('💾','Mentve: '+name);
  }catch(e){ if(!(e&&e.code==='declined')) toast('⚠️','A mentés most nem sikerült.'); }
}
function importData(){
  const inp=document.createElement('input'); inp.type='file'; inp.accept='.json,application/json';
  inp.onchange=()=>{ const f=inp.files[0]; if(!f) return; const r=new FileReader();
    r.onload=()=>{ let data; try{ data=JSON.parse(r.result); }catch(e){ toast('⚠️','Ez nem egy portál-mentés fájl.'); return; }
      if(!data||!Array.isArray(data.contracts)||!Array.isArray(data.households)){ toast('⚠️','Ez nem egy portál-mentés fájl.'); return; }
      confirmBox(`A jelenlegi adatok helyére a „${esc(f.name)}” mentés kerül (${data.households.length} ügyfél, ${data.contracts.length} szerződés).`,'Visszatöltés',()=>{ S=data; migrate(); selected.clear(); expanded.clear(); save(); render(); toast('✅','Adatok visszatöltve.'); });
    }; r.readAsText(f); };
  inp.click();
}

migrate(); save();
render();
</script>
